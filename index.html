<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সেশন ডাটাবক্স</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1730;--navy2:#16294e;--gold:#c59a4a;--gold2:#ead7ad;
  --paper:#f5f3ee;--card:#fff;--ink:#17233d;--muted:#687386;
  --line:#e5e1d8;--green:#237653;--red:#ad4038;--shadow:0 18px 50px rgba(11,23,48,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Hind Siliguri',sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid rgba(197,154,74,.45);outline-offset:2px}
header{
  position:sticky;top:0;z-index:30;height:76px;padding:0 32px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(11,23,48,.96);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(234,215,173,.25);box-shadow:0 5px 24px rgba(0,0,0,.12)
}
.brand{display:flex;align-items:center;gap:12px;color:#fff}
.brand-mark{width:40px;height:40px;border:1px solid rgba(234,215,173,.45);border-radius:11px;display:grid;place-items:center;color:var(--gold2);font-family:'Source Serif 4';font-weight:700;font-size:20px;background:linear-gradient(145deg,#1d3158,#0e1b36)}
.brand-title{font-family:'Source Serif 4',serif;font-size:1.25rem;font-weight:700;line-height:1}
.brand-title span{color:var(--gold2)}
.brand-sub{font-size:.68rem;color:#b9c1d0;margin-top:4px;letter-spacing:.4px}
.btn{border:0;border-radius:10px;padding:10px 17px;font-weight:700;transition:.18s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{transform:translateY(-1px)}
.btn-gold{background:var(--gold);color:#201705}.btn-gold:hover{background:#d2a956}
.btn-outline{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff}
.btn-navy{background:var(--navy2);color:#fff}.btn-red{background:transparent;border:1px solid #d7aaa5;color:var(--red)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--muted)}
main{max-width:1040px;margin:auto;padding:0 24px 90px}
.hero{background:transparent;padding:28px 0 18px;max-width:100%;box-shadow:none}
.hero:after{content:"";position:absolute;width:280px;height:280px;border:1px solid rgba(234,215,173,.12);border-radius:50%;right:-70px;bottom:-140px}
.hero-content{max-width:760px;margin:0 auto}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--gold2);font-weight:700;font-size:.82rem;letter-spacing:.7px;margin-bottom:12px}
.eyebrow i{width:7px;height:7px;background:var(--gold);border-radius:50%;box-shadow:0 0 12px var(--gold)}
.hero h1{font-family:'Source Serif 4',serif;font-size:clamp(2rem,4vw,3.25rem);line-height:1.12;margin:0 0 10px}
.hero p{margin:0 0 26px;color:#c5ccda;max-width:650px;font-size:1rem}
.search-box{position:relative;background:#fff;border:1px solid #e2ddd2;border-radius:16px;box-shadow:0 8px 24px rgba(15,29,56,.08);overflow:hidden;display:flex;align-items:center}
.search-box input{width:100%;height:58px;border:0;outline:0;background:transparent;padding:0 14px;font-size:1rem;color:var(--navy)}
.search-btn{min-width:120px;justify-content:center}
.search-icon{display:flex;align-items:center;justify-content:center;width:46px;height:58px;flex-shrink:0;color:var(--muted)}
.search-icon svg{width:20px;height:20px}
.mic-btn{display:flex;align-items:center;justify-content:center;width:46px;height:58px;flex-shrink:0;border:0;background:transparent;color:var(--muted);border-left:1px solid var(--line);transition:.18s}
.mic-btn svg{width:20px;height:20px;pointer-events:none}
.mic-btn:hover{color:var(--navy)}
.mic-btn.listening{color:#fff;background:var(--red);border-left-color:var(--red);animation:micPulse 1.1s ease-in-out infinite}
@keyframes micPulse{0%{box-shadow:0 0 0 0 rgba(173,64,56,.45)}70%{box-shadow:0 0 0 10px rgba(173,64,56,0)}100%{box-shadow:0 0 0 0 rgba(173,64,56,0)}}
.voice-status{font-size:.76rem;color:var(--gold2);margin-top:8px;min-height:16px}
.filter-bar{display:flex;gap:7px;margin-bottom:9px}
.filter-bar select{flex:1;min-width:0;height:38px;border:1px solid #e2ddd2;border-radius:9px;background:#fff;color:var(--navy);font-size:.78rem;font-weight:600;padding:0 8px;outline:0;box-shadow:0 4px 12px rgba(15,29,56,.06);appearance:none;-webkit-appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23687386" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>');background-repeat:no-repeat;background-position:right 6px center;background-size:14px}
.filter-bar select:focus{border-color:var(--gold)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.quick span{font-size:.76rem;color:#d3d8e2;border:1px solid rgba(255,255,255,.16);padding:5px 10px;border-radius:999px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:20px 0 15px}
.section-title{font-family:'Source Serif 4',serif;font-size:1.55rem;margin:0}
.section-kicker{color:var(--muted);font-size:.82rem;margin-top:2px}
.result-count{font-size:.82rem;color:var(--muted);background:#fff;border:1px solid var(--line);padding:7px 11px;border-radius:9px;white-space:nowrap}
.results{display:grid;grid-template-columns:1fr;gap:14px}
.card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden;
  display:grid;grid-template-columns:1fr 220px;min-height:0;box-shadow:0 4px 16px rgba(11,23,48,.045);
  transition:transform .2s,box-shadow .2s,border-color .2s
}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent,var(--navy2))}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(11,23,48,.12);border-color:#d9d4c8}
.card-body{padding:14px 18px 13px 24px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.card-top{display:flex;align-items:center;justify-content:flex-start;gap:12px;margin-bottom:5pxgap:30px;margin-bottom:5px}
.card-identity{display:flex;align-items:center;gap:31px;min-width:0}
.card-identity .institute{margin:0}
.institute{font-family:'Source Serif 4',serif;font-size:1.22rem;font-weight:700;color:var(--navy)}
.level{color:#fff;padding:6px 14px;border-radius:9px;font-size:.86rem;font-weight:700;white-space:nowrap}
.level-bba{background:linear-gradient(135deg,#0f766e,#115e59);box-shadow:0 4px 10px rgba(15,118,110,.18)}
.level-mba{background:linear-gradient(135deg,#7c3aed,#5b21b6);box-shadow:0 4px 10px rgba(124,58,237,.18)}
.level-bbs{background:linear-gradient(135deg,#b45309,#92400e);box-shadow:0 4px 10px rgba(180,83,9,.18)}
.level-professional{background:linear-gradient(135deg,#be123c,#9f1239);box-shadow:0 4px 10px rgba(190,18,60,.18)}
.level-default{background:linear-gradient(135deg,#16294e,#0b1730)}
.department{font-size:1.12rem;font-weight:700;margin-bottom:6px}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.meta span{background:#f5f2ea;border:1px solid #e8e3d8;color:#566174;padding:3px 8px;border-radius:7px;font-size:.8rem;font-weight:600}
.desc{color:var(--muted);font-size:.88rem;margin:6px 0 0;line-height:1.5;max-width:680px}
.price-panel{background:linear-gradient(145deg,#fff9eb,#f5e7c5);border-left:1px solid var(--line);display:grid;grid-template-columns:1fr;align-content:center}
.price{padding:10px 15px;text-align:center}.price+.price{border-top:1px solid rgba(23,35,61,.10)}
.price-label{font-size:.69rem;font-weight:700;color:#786331;text-transform:uppercase;letter-spacing:.7px}
.price-value{font-size:1.28rem;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.price.last .price-value{color:var(--red)}
.saving{font-size:.68rem;color:var(--green);font-weight:700;margin-top:3px}
.empty{background:#fff;border:1px dashed #d9d4c8;border-radius:17px;text-align:center;padding:55px 20px;color:var(--muted)}
.empty-icon{font-size:2rem;margin-bottom:8px}.empty strong{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:3px}
.overlay{position:fixed;inset:0;background:rgba(7,15,31,.66);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
.overlay.show{display:flex}
.modal{background:#fff;width:100%;max-width:440px;border-radius:18px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal.wide{max-width:580px}
.modal h2{font-family:'Source Serif 4';margin:0;font-size:1.4rem}.sub{color:var(--muted);font-size:.85rem;margin:4px 0 20px}
.field{margin-bottom:13px}.field label{display:block;font-weight:700;font-size:.8rem;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fbfaf7;outline:0}
.field textarea{min-height:82px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:17px}.error-text{color:var(--red);font-size:.82rem;min-height:18px;margin:2px 0 8px}
#adminView{display:none}.admin-topbar{display:flex;justify-content:space-between;align-items:center;padding:28px 0 17px;border-bottom:1px solid var(--line);margin-bottom:20px}
.admin-topbar h1{font-family:'Source Serif 4';margin:0}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab-btn{border:1px solid var(--line);background:#fff;padding:9px 15px;border-radius:9px;font-weight:700;color:var(--muted)}.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.admin-section{display:none}.admin-section.active{display:block}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:850px}th{background:#efede6;text-align:left;padding:11px;font-size:.8rem}td{padding:11px;border-top:1px solid var(--line);font-size:.82rem;vertical-align:top}.desc-cell{max-width:220px;color:var(--muted)}.row-actions{display:flex;gap:6px;white-space:nowrap}.row-actions button{padding:6px 10px;font-size:.76rem}
.loading{background:#fff;border-radius:15px;padding:30px;text-align:center;color:var(--muted)}
@media(max-width:700px){
 header{height:68px;padding:0 16px}.brand-sub{display:none}.brand-title{font-size:1.05rem}.brand-mark{width:35px;height:35px}
 main{padding:0 14px 60px}.hero{margin:14px 0 22px;padding:36px 20px 30px;border-radius:19px}.hero h1{font-size:2rem}.hero p{font-size:.9rem}
 .search-box{border-radius:13px}.search-box input{padding:0 10px}.search-icon,.mic-btn{width:40px}
 .filter-bar{gap:5px}.filter-bar select{font-size:.7rem;padding:0 5px;height:36px;background-position:right 3px center;background-size:12px}
 .card{grid-template-columns:1fr}.price-panel{border-left:0;border-top:1px solid var(--line);grid-template-columns:1fr 1fr}.price+.price{border-top:0;border-left:1px solid rgba(23,35,61,.10)}
 .card-body{padding:13px 15px 12px 20px}.department{font-size:1rem}.section-head{align-items:flex-start;flex-direction:column;gap:7px}.result-count{white-space:normal}
 .two-col{grid-template-columns:1fr}.admin-topbar{align-items:flex-start;gap:10px;flex-direction:column}
}
.card-top .level{order:-1}
</style>
</head>

<script>
const API_BASE="https://visiondatabox-worker.dreamsicreation.workers.dev";
let records=[],editingId=null,adminToken=localStorage.getItem("adminToken")||null;
// Edit distance (Levenshtein) - measures how many letters differ between two words (typo tolerance)
function levenshtein(a,b){
 if(a===b)return 0;
 if(!a.length)return b.length;
 if(!b.length)return a.length;
 const dp=new Array(b.length+1);
 for(let j=0;j<=b.length;j++)dp[j]=j;
 for(let i=1;i<=a.length;i++){
   let prev=dp[0];dp[0]=i;
   for(let j=1;j<=b.length;j++){
     const temp=dp[j];
     dp[j]=a[i-1]===b[j-1]?prev:1+Math.min(prev,dp[j],dp[j-1]);
     prev=temp;
   }
 }
 return dp[b.length];
}
// how many typo'd letters we allow, scaled with word length (longer word = a bit more tolerance, capped)
function fuzzyThreshold(len){return Math.min(3,Math.max(1,Math.floor(len/4)))}
// a query token matches a record if it's an exact substring anywhere (fast path, also covers partial typing like "Acc")
// OR if it's within edit-distance of some whole word in the record (typo tolerance, e.g. "Accaounting" -> "Accounting")
function tokenMatches(token,haystack,words){
 if(haystack.includes(token))return true;
 if(token.length<3)return false; // too short to fuzzy-match reliably, avoids false positives
 const thr=fuzzyThreshold(token.length);
 return words.some(w=>Math.abs(w.length-token.length)<=thr && levenshtein(token,w)<=thr);
}
function matches(r,q){
 if(!q)return true;
 const t=q.trim().toLowerCase().split(/\s+/).filter(Boolean);
 const h=[r.institute,r.level,r.department,r.year,r.session,r.description].join(" ").toLowerCase();
 const words=h.split(/[^a-z0-9\u0980-\u09FF]+/).filter(Boolean);
 return t.every(x=>tokenMatches(x,h,words));
}
function fmtPrice(n){return"৳"+Number(n||0).toLocaleString("en-US")}
const ACCENTS=["#1F3057","#B8862E","#2E6B52","#7A4F24","#3E5C76"];
function accentFor(r){const k=(r.institute||"")+(r.level||"");let h=0;for(let i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;return ACCENTS[h%ACCENTS.length]}
async function apiFetch(path,options={}){const headers=Object.assign({"Content-Type":"application/json"},options.headers||{});if(adminToken)headers.Authorization="Bearer "+adminToken;const res=await fetch(API_BASE+path,{...options,headers});let data=null;try{data=await res.json()}catch(e){}if(!res.ok)throw new Error(data?.error||"একটা সমস্যা হয়েছে।");return data}
async function loadRecords(){try{records=await apiFetch("/api/records")}catch(e){console.error(e);records=[]}}
function levelClass(level){
 const v=(level||"").toLowerCase().replace(/[^a-z0-9]+/g,"");
 if(v.includes("bba"))return "level-bba";
 if(v.includes("mba"))return "level-mba";
 if(v.includes("bbs"))return "level-bbs";
 if(v.includes("professional"))return "level-professional";
 return "level-default";
}
function updateFilterVisibility(){
 const level=document.getElementById("filterLevel").value;
 const needsInstitute=level===""||["BBA","MBA","BBS"].includes(level);
 const needsDept=level===""||level!=="HSC";
 const instSel=document.getElementById("filterInstitute"),deptSel=document.getElementById("filterDept");
 instSel.style.display=needsInstitute?"":"none";
 deptSel.style.display=needsDept?"":"none";
 if(!needsInstitute)instSel.value="";
 if(!needsDept)deptSel.value="";
}
function combinedMatches(r){
 const q=document.getElementById("publicSearch").value;
 if(!matches(r,q))return false;
 const lv=document.getElementById("filterLevel").value; if(lv && r.level!==lv)return false;
 const yr=document.getElementById("filterYear").value; if(yr && r.year!==yr)return false;
 const dep=document.getElementById("filterDept").value; if(dep && r.department!==dep)return false;
 const inst=document.getElementById("filterInstitute").value; if(inst && r.institute!==inst)return false;
 return true;
}
function fillFilterSelect(id,values,placeholder){
 const sel=document.getElementById(id),current=sel.value;
 sel.innerHTML=`<option value="">${placeholder}</option>`+values.map(v=>`<option value="${v}">${v}</option>`).join("");
 if(values.includes(current))sel.value=current;
}
function populateFilters(){
 fillFilterSelect("filterLevel",[...new Set(records.map(r=>r.level).filter(Boolean))].sort(),"Level");
 fillFilterSelect("filterYear",[...new Set(records.map(r=>r.year).filter(Boolean))].sort(),"Year");
 fillFilterSelect("filterDept",[...new Set(records.map(r=>r.department).filter(Boolean))].sort(),"Department");
 fillFilterSelect("filterInstitute",[...new Set(records.map(r=>r.institute).filter(Boolean))].sort(),"Institute");
}
function refreshPublicView(){populateFilters();updateFilterVisibility();renderPublic()}
function renderPublic(){
 const list=records.filter(combinedMatches),wrap=document.getElementById("publicResults");
 if(!list.length){wrap.innerHTML=`<div class="empty"><div class="empty-icon">⌕</div><strong>কোনো তথ্য পাওয়া যায়নি</strong><span>অন্য Institute, Department অথবা Session দিয়ে আবার চেষ্টা করুন।</span></div>`;return}
 wrap.innerHTML=list.map(r=>{const diff=Number(r.asking_price||0)-Number(r.last_price||0);return`
 <article class="card" style="--accent:${accentFor(r)}">
  <div class="card-body">
   <div class="card-top"><div class="card-identity"><span class="level ${levelClass(r.level)}">${r.level||""}</span><div class="institute">${r.institute||""}</div></div></div>
   <div class="department">${r.department||""}</div>
   <div class="meta"><span>${r.year||""}</span><span>Session ${r.session||""}</span></div>
   ${r.description?`<p class="desc">${r.description}</p>`:""}
  </div>
  <div class="price-panel">
   <div class="price"><div class="price-label">Asking Price</div><div class="price-value">${fmtPrice(r.asking_price)}</div></div>
   <div class="price last"><div class="price-label">Last Price</div><div class="price-value">${Number(r.last_price)>0?fmtPrice(r.last_price):"—"}</div>${diff>0&&Number(r.last_price)>0?``:""}</div>
  </div>
 </article>`}).join("")
}
function renderAdminTable(){const q=document.getElementById("adminSearch").value,list=records.filter(r=>matches(r,q)),b=document.getElementById("adminTableBody");b.innerHTML=list.length?list.map(r=>`<tr><td>${r.institute}</td><td>${r.level}</td><td>${r.department}</td><td>${r.year}</td><td>${r.session}</td><td>${fmtPrice(r.asking_price)}</td><td>${fmtPrice(r.last_price)}</td><td class="desc-cell">${r.description||""}</td><td><div class="row-actions"><button class="btn btn-ghost" onclick="openEdit(${r.id})">এডিট</button><button class="btn btn-red" onclick="deleteRecord(${r.id})">ডিলিট</button></div></td></tr>`).join(""):`<tr><td colspan="9" style="text-align:center;padding:25px;color:var(--muted)">কোনো তথ্য পাওয়া যায়নি</td></tr>`}
function openLogin(){loginError.textContent="";loginUser.value="";loginPass.value="";loginOverlay.classList.add("show")}
function closeLogin(){loginOverlay.classList.remove("show")}
async function login(){const u=loginUser.value.trim(),p=loginPass.value;loginError.textContent="";try{const d=await apiFetch("/api/login",{method:"POST",body:JSON.stringify({username:u,password:p})});adminToken=d.token;localStorage.setItem("adminToken",adminToken);closeLogin();publicView.style.display="none";adminView.style.display="block";openLoginBtn.textContent="Logout";openLoginBtn.onclick=logout;await loadRecords();renderAdminTable()}catch(e){loginError.textContent=e.message}}
function logout(){adminToken=null;localStorage.removeItem("adminToken");adminView.style.display="none";publicView.style.display="block";openLoginBtn.textContent="Admin Login";openLoginBtn.onclick=openLogin;loadRecords().then(refreshPublicView)}
function goHome(){adminView.style.display="none";publicView.style.display="block";loadRecords().then(refreshPublicView)}
function switchTab(t){document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));document.getElementById("tab-manage").classList.toggle("active",t==="manage");document.getElementById("tab-add").classList.toggle("active",t==="add")}
function updateLevelFields(prefix){
 const level=document.getElementById(prefix+"_level").value;
 const instituteField=document.getElementById(prefix+"InstituteField");
 const departmentField=document.getElementById(prefix+"DepartmentField");
 const institute=document.getElementById(prefix+"_institute");
 const department=document.getElementById(prefix+"_department");

 const needsInstitute=["BBA","MBA","BBS"].includes(level);
 const needsDepartment=level!=="HSC" && level!=="";

 instituteField.style.display=needsInstitute?"block":"none";
 departmentField.style.display=needsDepartment?"block":"none";

 if(!needsInstitute) institute.value="";
 if(!needsDepartment) department.value="";
}

function setSelectValue(id,value){
 const select=document.getElementById(id);
 if(!select)return;
 const exists=[...select.options].some(o=>o.value===value);
 if(value && !exists){
   const option=document.createElement("option");
   option.value=value; option.textContent=value;
   option.dataset.existing="true";
   select.appendChild(option);
 }
 select.value=value||"";
}

async function addRecord(){
 const level=add_level.value.trim();
 const institute=add_institute.value.trim();
 const department=add_department.value.trim();
 const year=add_year.value.trim();
 const session=add_session.value.trim();
 const asking_price=add_asking.value;
 const last_price=add_last.value;
 const description=add_desc.value.trim();

 if(!level||!year||!session||!asking_price){
   addError.textContent="Level, Year, Session এবং Asking Price আবশ্যক।"; return;
 }
 if(["BBA","MBA","BBS"].includes(level) && !institute){
   addError.textContent="এই Level-এর জন্য Institute নির্বাচন করুন।"; return;
 }
 if(level!=="HSC" && !department){
   addError.textContent="Department নির্বাচন করুন।"; return;
 }

 addError.textContent="";
 try{
   await apiFetch("/api/records",{method:"POST",body:JSON.stringify({
     institute,level,department,year,session,asking_price,last_price,description
   })});
   ["add_institute","add_level","add_department","add_year","add_session","add_asking","add_last","add_desc"]
     .forEach(id=>document.getElementById(id).value="");
   updateLevelFields("add");
   await loadRecords(); renderAdminTable(); switchTab("manage");
 }catch(e){addError.textContent=e.message}
}

function openEdit(id){
 const r=records.find(x=>x.id===id); if(!r)return;
 editingId=id;
 setSelectValue("edit_level",r.level);
 setSelectValue("edit_institute",r.institute);
 setSelectValue("edit_department",r.department);
 updateLevelFields("edit");
 setSelectValue("edit_institute",r.institute);
 setSelectValue("edit_department",r.department);
 edit_year.value=r.year;
 edit_session.value=r.session;
 edit_asking.value=r.asking_price;
 edit_last.value=r.last_price;
 edit_desc.value=r.description||"";
 editError.textContent="";
 editOverlay.classList.add("show");
}

function closeEdit(){editOverlay.classList.remove("show");editingId=null}

async function saveEdit(){
 const level=edit_level.value.trim();
 const institute=edit_institute.value.trim();
 const department=edit_department.value.trim();
 const year=edit_year.value.trim();
 const session=edit_session.value.trim();
 const asking_price=edit_asking.value;
 const last_price=edit_last.value;
 const description=edit_desc.value.trim();

 if(!level||!year||!session||!asking_price){
   editError.textContent="Level, Year, Session এবং Asking Price আবশ্যক।"; return;
 }
 if(["BBA","MBA","BBS"].includes(level) && !institute){
   editError.textContent="এই Level-এর জন্য Institute নির্বাচন করুন।"; return;
 }
 if(level!=="HSC" && !department){
   editError.textContent="Department নির্বাচন করুন।"; return;
 }

 try{
   await apiFetch(`/api/records/${editingId}`,{method:"PUT",body:JSON.stringify({
     institute,level,department,year,session,asking_price,last_price,description
   })});
   closeEdit(); await loadRecords(); renderAdminTable();
 }catch(e){editError.textContent=e.message}
}
async function deleteRecord(id){if(!confirm("আপনি কি নিশ্চিত এই তথ্যটি ডিলিট করতে চান?"))return;try{await apiFetch(`/api/records/${id}`,{method:"DELETE"});await loadRecords();renderAdminTable()}catch(e){alert(e.message)}}
openLoginBtn.onclick=openLogin;cancelLoginBtn.onclick=closeLogin;submitLoginBtn.onclick=login;publicSearch.oninput=renderPublic;adminSearch.oninput=renderAdminTable;addSubmitBtn.onclick=addRecord;cancelEditBtn.onclick=closeEdit;saveEditBtn.onclick=saveEdit;
document.getElementById("filterLevel").onchange=()=>{updateFilterVisibility();renderPublic()};
["filterYear","filterDept","filterInstitute"].forEach(id=>document.getElementById(id).onchange=renderPublic);
add_level.onchange=()=>updateLevelFields("add");
edit_level.onchange=()=>updateLevelFields("edit");
updateLevelFields("add");document.querySelectorAll(".tab-btn").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
document.querySelectorAll(".quick span").forEach(s=>s.onclick=()=>{publicSearch.value=s.textContent;renderPublic();document.getElementById("publicResults").scrollIntoView({behavior:"smooth",block:"start"})});
loginPass.onkeydown=e=>{if(e.key==="Enter")login()};

/* ---------- Voice Search (Bangla speech -> English keywords) ---------- */
const BN_DIGIT_MAP={"০":"0","১":"1","২":"2","৩":"3","৪":"4","৫":"5","৬":"6","৭":"7","৮":"8","৯":"9"};
function bnDigitsToEn(s){return s.replace(/[০-৯]/g,d=>BN_DIGIT_MAP[d]||d)}

// Bangla phrase -> English search keyword. Longer/more specific phrases are matched first.
const VOICE_KEYWORD_MAP=[
 ["জাতীয় বিশ্ববিদ্যালয়","National University"],
 ["ন্যাশনাল ইউনিভার্সিটি","National University"],
 ["ঢাকা সেন্ট্রাল ইউনিভার্সিটি","Dhaka Central University"],
 ["ঢাকা সেন্ট্রাল","Dhaka Central University"],
 ["বিবিএ প্রফেশনাল","BBA Professional"],
 ["বি বি এ প্রফেশনাল","BBA Professional"],
 ["বিবিএস","BBS"],
 ["বি বি এস","BBS"],
 ["বিবিএ","BBA"],
 ["বি বি এ","BBA"],
 ["এমবিএ","MBA"],
 ["এম বি এ","MBA"],
 ["এইচএসসি","HSC"],
 ["এইচ এস সি","HSC"],
 ["অ্যাকাউন্টিং","Accounting"],
 ["একাউন্টিং","Accounting"],
 ["হিসাববিজ্ঞান","Accounting"],
 ["ম্যানেজমেন্ট","Management"],
 ["ব্যবস্থাপনা","Management"],
 ["ফাইন্যান্স","Finance"],
 ["অর্থায়ন","Finance"],
 ["মার্কেটিং","Marketing"],
 ["বিপণন","Marketing"],
 ["অনার্স","Honours"],
 ["মাস্টার্স","Masters"],
 ["প্রথম বর্ষ","1st"],
 ["ফার্স্ট ইয়ার","1st"],
 ["দ্বিতীয় বর্ষ","2nd"],
 ["সেকেন্ড ইয়ার","2nd"],
 ["তৃতীয় বর্ষ","3rd"],
 ["থার্ড ইয়ার","3rd"],
 ["চতুর্থ বর্ষ","4th"],
 ["ফোর্থ ইয়ার","4th"],
].sort((a,b)=>b[0].length-a[0].length);

// Words that carry no search meaning by themselves - stripped out so they don't leak into the query as noise.
const VOICE_STOPWORDS=["ডিপার্টমেন্ট","বিভাগ","সেশন","ইয়ার","বর্ষ","ইউনিভার্সিটি","বিশ্ববিদ্যালয়","আমি","যদি","বলি","খুঁজে","খুঁজো","দাও","চাই","সার্চ","করো","কর","এর","টা","টি","দেখাও","প্লিজ"];

function extractVoiceKeywords(raw){
 let text=" "+bnDigitsToEn(raw.trim())+" ";
 const found=[];
 VOICE_KEYWORD_MAP.forEach(([bn,en])=>{
   if(text.includes(bn)){
     found.push(en);
     text=text.split(bn).join(" ");
   }
 });
 VOICE_STOPWORDS.forEach(w=>{text=text.split(w).join(" ")});
 // whatever is left (already-English words, digits, session ranges like 21-22) is kept as-is; plain leftover Bangla words are dropped as noise
 const leftoverTokens=text.split(/\s+/).map(t=>t.trim()).filter(t=>t.length>1 && /[A-Za-z0-9]/.test(t));
 leftoverTokens.forEach(t=>found.push(t));
 const seen=new Set(),result=[];
 found.forEach(t=>{const k=t.toLowerCase();if(!seen.has(k)){seen.add(k);result.push(t)}});
 return result.join(" ");
}

const SpeechRecognitionAPI=window.SpeechRecognition||window.webkitSpeechRecognition;
const micBtn=document.getElementById("micBtn"),voiceStatus=document.getElementById("voiceStatus");
if(!SpeechRecognitionAPI){
 micBtn.style.display="none";
}else{
 const recognition=new SpeechRecognitionAPI();
 recognition.lang="bn-BD";
 recognition.continuous=false;
 recognition.interimResults=false;
 recognition.maxAlternatives=1;
 let listening=false;
 micBtn.onclick=()=>{
   if(listening){recognition.stop();return}
   try{recognition.start()}catch(e){}
 };
 recognition.onstart=()=>{
   listening=true;
   micBtn.classList.add("listening");
   voiceStatus.textContent="শুনছি... এখন বলুন";
 };
 recognition.onresult=(event)=>{
   const transcript=event.results[0][0].transcript;
   const keywords=extractVoiceKeywords(transcript);
   publicSearch.value=keywords||transcript;
   renderPublic();
   voiceStatus.textContent=`শোনা গেছে: "${transcript}"`;
 };
 recognition.onerror=(event)=>{
   voiceStatus.textContent=event.error==="not-allowed"?"মাইক্রোফোন অনুমতি দেওয়া হয়নি।":"ভয়েস শনাক্ত করা যায়নি, আবার চেষ্টা করুন।";
 };
 recognition.onend=()=>{
   listening=false;
   micBtn.classList.remove("listening");
 };
}

loadRecords().then(refreshPublicView);
</script>
